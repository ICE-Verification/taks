<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساعد التقارير اليومية | عزام</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
            --whatsapp: #25D366;
            --whatsapp-hover: #128C7E;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        h1 { text-align: center; color: var(--primary); margin-bottom: 30px; font-size: 1.5rem; }
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: var(--card);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        h2 { font-size: 1.1rem; margin-top: 0; border-bottom: 2px solid var(--border); padding-bottom: 10px; }
        
        /* Timer Styles */
        .timer-display {
            font-size: 3.5rem;
            font-weight: bold;
            text-align: center;
            margin: 15px 0;
            color: var(--primary);
            font-variant-numeric: tabular-nums;
        }
        .btn-group { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s;
            flex: 1;
            min-width: 80px;
        }
        button:hover { background-color: var(--primary-hover); }
        .btn-danger { background-color: #ef4444; }
        .btn-danger:hover { background-color: #dc2626; }
        .btn-success { background-color: #10b981; width: 100%; margin-top: 20px; font-size: 1.1rem; padding: 15px;}
        .btn-success:hover { background-color: #059669; }
        .btn-whatsapp { background-color: var(--whatsapp); width: 100%; margin-top: 10px; font-size: 1.1rem; padding: 15px; font-weight: bold; }
        .btn-whatsapp:hover { background-color: var(--whatsapp-hover); }

        /* Inputs & Textareas */
        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: inherit;
            box-sizing: border-box;
            resize: vertical;
        }
        textarea { height: 90px; }
        
        /* Log List */
        .log-list {
            list-style: none;
            padding: 0;
            max-height: 200px;
            overflow-y: auto;
        }
        .log-list li {
            background: var(--bg);
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            border-right: 4px solid var(--primary);
            font-size: 0.95rem;
            display: flex;
            justify-content: space-between;
        }
        .delete-log {
            color: #ef4444; cursor: pointer; font-weight: bold; padding: 0 5px; font-size: 1.2rem;
        }

        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
            body { padding: 10px; }
            .btn-group button { font-size: 0.9rem; padding: 10px; }
        }
    </style>
</head>
<body>

    <h1>نظام تقارير العمل اليومية</h1>

    <div class="container">
        <!-- القسم الأيسر: المؤقت وسجل الساعات -->
        <div class="card">
            <h2>⏱️ مؤقت الإنجاز (يعمل في الخلفية)</h2>
            <div class="timer-display" id="timer">60:00</div>
            <div class="btn-group">
                <button onclick="startTimer()">▶️ بدء</button>
                <button onclick="pauseTimer()">⏸️ إيقاف</button>
                <button onclick="resetTimer()" class="btn-danger">🔄 تصفير</button>
            </div>

            <h2 style="margin-top: 30px;">📝 مسودة الإنجاز الساعي</h2>
            <p style="font-size: 0.8rem; color: #64748b; margin-top: -5px;">(سيتم نقل المهام المضافة هنا إلى قسم "المهام المنجزة" تلقائياً)</p>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="log-input" placeholder="ماذا أنجزت؟">
                <button onclick="addLog()" style="margin-bottom: 15px; flex: 0.3;">إضافة</button>
            </div>
            <ul class="log-list" id="log-list"></ul>
            <button onclick="clearLogs()" class="btn-danger" style="width: 100%; margin-top: 10px; font-size: 0.9rem;">🗑️ مسح كل المسودات</button>
        </div>

        <!-- القسم الأيمن: التقرير النهائي -->
        <div class="card">
            <h2>📋 التقرير النهائي</h2>
            
            <label>1- المهام المنجزة:</label>
            <textarea id="task-done" placeholder="الأعمال التي تم الانتهاء منها..."></textarea>

            <label>2- المهام قيد التنفيذ (مع نسبة الإنجاز):</label>
            <textarea id="task-progress" placeholder="مثال: تجهيز العرض التقديمي (70%)..."></textarea>

            <label>3- المشكلات والعقبات:</label>
            <textarea id="task-issues" placeholder="صعوبات أثرت على سير العمل..."></textarea>

            <label>4- خطة اليوم التالي:</label>
            <textarea id="task-next" placeholder="أولويات العمل للغد..."></textarea>

            <button onclick="generateAndCopyReport()" class="btn-success">📋 نسخ التقرير</button>
            <button onclick="sendViaWhatsApp()" class="btn-whatsapp">💬 إرسال التقرير عبر واتساب</button>
        </div>
    </div>

    <script>
        // إعداد الصوت
        const alarmSound = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');
        const TOTAL_DURATION = 3600; // 60 دقيقة بالثواني
        let timerInterval;
        let isRunning = false;
        const timerDisplay = document.getElementById('timer');

        // طلب صلاحية الإشعارات من النظام
        function requestNotificationPermission() {
            if ("Notification" in window) {
                if (Notification.permission !== "granted" && Notification.permission !== "denied") {
                    Notification.requestPermission();
                }
            }
        }

        // دالة إرسال الإشعار
        function sendNotification() {
            const title = "⏰ انتهت الساعة!";
            const options = {
                body: "حان وقت تسجيل إنجازاتك في التقرير الآن.",
                icon: "icon.png" // ستظهر أيقونة التطبيق هنا إذا كانت موجودة
            };

            if ("Notification" in window && Notification.permission === "granted") {
                // عرض إشعار نظام حقيقي
                new Notification(title, options);
            } else {
                // في حال رفض المستخدم الصلاحية، نستخدم التنبيه القديم كبديل
                alert(title + "\n" + options.body);
            }
        }

        // --- نظام المؤقت ---
        function updateTimerDisplay(secondsLeft) {
            let m = Math.floor(secondsLeft / 60).toString().padStart(2, '0');
            let s = (secondsLeft % 60).toString().padStart(2, '0');
            timerDisplay.textContent = `${m}:${s}`;
        }

        function timerTick() {
            let endTime = localStorage.getItem('timerEndTime');
            if (!endTime) return;

            let timeLeft = Math.round((endTime - Date.now()) / 1000);

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                isRunning = false;
                localStorage.removeItem('timerEndTime');
                
                // تشغيل الصوت وإرسال الإشعار
                alarmSound.play().catch(e => console.log("الصوت يحتاج تفاعل"));
                sendNotification();
                
                updateTimerDisplay(0);
                resetTimer();
            } else {
                updateTimerDisplay(timeLeft);
            }
        }

        function startTimer() {
            if (isRunning) return;

            // طلب صلاحية الإشعارات عند ضغط زر "بدء"
            requestNotificationPermission();

            // تشغيل صامت للسماح بالصوت لاحقاً
            alarmSound.play().then(() => {
                alarmSound.pause();
                alarmSound.currentTime = 0;
            }).catch(e => {});

            let endTime = localStorage.getItem('timerEndTime');
            
            if (!endTime || endTime <= Date.now()) {
                let savedRemaining = localStorage.getItem('pausedTimeLeft');
                let timeToRun = savedRemaining ? parseInt(savedRemaining) : TOTAL_DURATION;
                
                endTime = Date.now() + (timeToRun * 1000);
                localStorage.setItem('timerEndTime', endTime);
                localStorage.removeItem('pausedTimeLeft');
            }

            isRunning = true;
            timerInterval = setInterval(timerTick, 1000);
            timerTick(); 
        }

        function pauseTimer() {
            if (!isRunning) return;
            clearInterval(timerInterval);
            isRunning = false;
            
            let endTime = localStorage.getItem('timerEndTime');
            if (endTime) {
                let timeLeft = Math.round((endTime - Date.now()) / 1000);
                if (timeLeft > 0) {
                    localStorage.setItem('pausedTimeLeft', timeLeft);
                }
                localStorage.removeItem('timerEndTime');
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            localStorage.removeItem('timerEndTime');
            localStorage.removeItem('pausedTimeLeft');
            updateTimerDisplay(TOTAL_DURATION);
        }

        // --- نظام المهام والنقل التلقائي ---
        function addLog() {
            const input = document.getElementById('log-input');
            const text = input.value.trim();
            if (text === "") return;

            const now = new Date();
            const timeString = now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
            
            const logs = JSON.parse(localStorage.getItem('workLogs') || '[]');
            logs.push({ time: timeString, text: text });
            localStorage.setItem('workLogs', JSON.stringify(logs));
            
            const doneTextarea = document.getElementById('task-done');
            const currentDoneText = doneTextarea.value.trim();
            const newEntry = `- ${text} (${timeString})`;
            
            if (currentDoneText === "") {
                doneTextarea.value = newEntry;
            } else {
                doneTextarea.value = currentDoneText + '\n' + newEntry;
            }
            localStorage.setItem('task-done', doneTextarea.value);

            input.value = "";
            renderLogs();
        }

        function renderLogs() {
            const list = document.getElementById('log-list');
            list.innerHTML = "";
            const logs = JSON.parse(localStorage.getItem('workLogs') || '[]');
            
            logs.forEach((log, index) => {
                const li = document.createElement('li');
                li.innerHTML = `<span><b>[${log.time}]</b> ${log.text}</span> <span class="delete-log" onclick="deleteLog(${index})">×</span>`;
                list.appendChild(li);
            });
        }

        function deleteLog(index) {
            const logs = JSON.parse(localStorage.getItem('workLogs') || '[]');
            logs.splice(index, 1);
            localStorage.setItem('workLogs', JSON.stringify(logs));
            renderLogs();
        }

        function clearLogs() {
            if(confirm("هل أنت متأكد من مسح جميع مسودات اليوم؟ (لن يمسح هذا ما تم نقله للمهام المنجزة)")) {
                localStorage.removeItem('workLogs');
                renderLogs();
            }
        }

        // --- الحفظ التلقائي للنصوص ---
        const textareas = ['task-done', 'task-progress', 'task-issues', 'task-next'];
        
        textareas.forEach(id => {
            const el = document.getElementById(id);
            if (localStorage.getItem(id)) el.value = localStorage.getItem(id);
            el.addEventListener('input', () => localStorage.setItem(id, el.value));
        });

        function buildReportString() {
            const done = document.getElementById('task-done').value;
            const progress = document.getElementById('task-progress').value;
            const issues = document.getElementById('task-issues').value;
            const next = document.getElementById('task-next').value;

            return `*تقرير العمل اليومي*\n\n*1- المهام المنجزة:*\n${done || "لا يوجد"}\n\n*2- المهام قيد التنفيذ:*\n${progress || "لا يوجد"}\n\n*3- المشكلات والعقبات:*\n${issues || "لا يوجد"}\n\n*4- خطة اليوم التالي:*\n${next || "لا يوجد"}`;
        }

        function generateAndCopyReport() {
            const finalReport = buildReportString();
            navigator.clipboard.writeText(finalReport).then(() => {
                alert("✅ تم نسخ التقرير بنجاح!");
            });
        }

        function sendViaWhatsApp() {
            const finalReport = buildReportString();
            const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(finalReport)}`;
            window.open(whatsappUrl, '_blank');
        }

        window.onload = function() {
            renderLogs();
            let endTime = localStorage.getItem('timerEndTime');
            
            if (endTime) {
                if (endTime > Date.now()) {
                    startTimer();
                } else {
                    localStorage.removeItem('timerEndTime');
                    updateTimerDisplay(0);
                    sendNotification(); // إرسال إشعار إذا دخل التطبيق ووجد أن الوقت منتهي
                    resetTimer();
                }
            } else {
                let paused = localStorage.getItem('pausedTimeLeft');
                if (paused) {
                    updateTimerDisplay(parseInt(paused));
                }
            }
        };
    </script>
</body>
</html>
